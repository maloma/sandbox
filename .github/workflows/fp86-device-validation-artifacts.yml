name: FP86 Device Validation Artifacts

on:
  pull_request:
    branches: [fp86-device-validation-base]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [ru-RU, uk-UA, sk-SK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: node tools/fp86-voice-v1-domain-smoke.cjs
      - run: node tools/fp86-native-stt-contract-smoke.cjs
      - run: node tools/fp86-native-bridge-contract-smoke.cjs
      - run: node tools/fp86-native-app-shell-contract-smoke.cjs
      - run: gradle -p mobile/android-app :app:assembleDebug -PvoiceLocaleTag=${{ matrix.locale }}
      - run: test -f mobile/android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage APK
        run: |
          mkdir -p device-artifacts
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk "device-artifacts/FamilyPilot-${{ matrix.locale }}-debug.apk"
          sha256sum "device-artifacts/FamilyPilot-${{ matrix.locale }}-debug.apk" > "device-artifacts/FamilyPilot-${{ matrix.locale }}-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyPilot-${{ matrix.locale }}-device-test
          path: device-artifacts/
          if-no-files-found: error
          retention-days: 7
