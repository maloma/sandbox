name: PF-08A M4-04 Trusted Gate Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pf08a-m4-04-trusted-gate-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Quiet exact-head checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Print trusted gate integration contract
        run: |
          file="$(grep -R -l 'Verify integration contracts' .github/workflows | head -n 1)"
          echo "TRUSTED_WORKFLOW=${file}"
          awk '/name: Verify integration contracts/{show=1} show{print} show && /^      - name:/ && !/Verify integration contracts/{exit}' "${file}"
