name: FP82 One-Time Mirror Builder

on:
  push:
    branches:
      - agent/familypilot-82-mirror-builder-2026-08-09
    paths:
      - .github/workflows/fp82-one-time-mirror-builder.yml

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[fp82-mirror-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build exact debt UI mirrors
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const sourcePath='src/familypilot.html';
          const rootPath='index.html';
          const uiPath='familypilot-debts-ui.js';
          const workflowPath='.github/workflows/fp82-one-time-mirror-builder.yml';
          const start='/* pf08a-m2-01-inline-ui:start */';
          const end='/* pf08a-m2-01-inline-ui:end */';
          const backFix="  const debtBackButton=$('debtsScreen')?.querySelector('[data-debt-back]');if(debtBackButton){debtBackButton.removeAttribute('data-debt-back');debtBackButton.onclick=()=>{showScreen(lastNonDebtScreen||'home');renderAll()}}";
          const installNeedle='  installDebtDom();\n';
          const source=fs.readFileSync(sourcePath,'utf8');
          const root=fs.readFileSync(rootPath,'utf8');
          const ui=fs.readFileSync(uiPath,'utf8');
          if(source!==root)throw new Error('Precondition failed: source/index are not byte-identical');
          if((source.match(/\/\* pf08a-m2-01-inline-ui:start \*\//g)||[]).length!==1)throw new Error('Expected exactly one M2 start marker');
          if((source.match(/\/\* pf08a-m2-01-inline-ui:end \*\//g)||[]).length!==1)throw new Error('Expected exactly one M2 end marker');
          if((ui.match(/  installDebtDom\(\);\n/g)||[]).length!==1)throw new Error('Expected exactly one installDebtDom call in standalone UI');
          if(ui.includes('const debtBackButton='))throw new Error('Standalone UI unexpectedly already contains inline-only back fix');
          const inlineUi=ui.replace(installNeedle,installNeedle+backFix+'\n');
          const startAt=source.indexOf(start),endAt=source.indexOf(end,startAt+start.length);
          if(startAt<0||endAt<0||endAt<=startAt)throw new Error('M2 marker bounds invalid');
          const prefix=source.slice(0,startAt+start.length);
          const suffix=source.slice(endAt);
          const next=prefix+'\n'+inlineUi.trimEnd()+'\n'+suffix;
          const outsideBefore=source.slice(0,startAt+start.length)+source.slice(endAt);
          const nextEndAt=next.indexOf(end,next.indexOf(start)+start.length);
          const outsideAfter=next.slice(0,next.indexOf(start)+start.length)+next.slice(nextEndAt);
          if(outsideBefore!==outsideAfter)throw new Error('Content outside M2 block changed');
          if(!next.includes(backFix))throw new Error('Inline-only back navigation correction was not preserved');
          for(const marker of ['debtPlanningHorizon','debtOverdueList','debtDueInPeriodList','debtNoDueDateList','debtExpectedDueAt','debtApi.scopePlanning','debtApi.setChainExpectedDueAt'])if(!next.includes(marker))throw new Error('Missing FP82 marker: '+marker);
          fs.writeFileSync(sourcePath,next);
          fs.writeFileSync(rootPath,next);
          if(fs.readFileSync(sourcePath,'utf8')!==fs.readFileSync(rootPath,'utf8'))throw new Error('Generated source/index mirrors differ');
          NODE

      - name: Verify generated package before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check familypilot-debts-ui.js
          node tools/pf08a-m2-01-verify-debt-integration.mjs
          cmp -s src/familypilot.html index.html
          git diff --check -- src/familypilot.html index.html
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html src/familypilot.html "

      - name: Commit generated mirrors and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FamilyPilot Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/familypilot.html index.html
          git rm .github/workflows/fp82-one-time-mirror-builder.yml
          git commit -m 'FamilyPilot #82 sync verified debt planning UI mirrors [fp82-mirror-sync]'
          git push origin HEAD:agent/familypilot-82-mirror-builder-2026-08-09
