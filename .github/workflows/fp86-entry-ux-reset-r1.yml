name: FP86 Entry UX Reset R1

on:
  pull_request:
    branches: [fp86-entry-ux-reset-r1-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: node tools/fp86-voice-v1-domain-smoke.cjs
      - run: node tools/fp86-native-stt-contract-smoke.cjs
      - run: node tools/fp86-native-bridge-contract-smoke.cjs
      - run: node tools/fp86-native-app-shell-contract-smoke.cjs
      - run: node tools/fp86-physical-input-ux-smoke.cjs
      - run: gradle -p mobile/android-app :app:assembleDebug -PvoiceLocaleTag=ru-RU
      - run: test -f mobile/android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage Android APK
        run: |
          mkdir -p dist
          cp mobile/android-app/app/build/outputs/apk/debug/app-debug.apk dist/FamilyPilot-ru-RU-entry-ux-reset-r1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyPilot-ru-RU-entry-ux-reset-r1
          path: dist/FamilyPilot-ru-RU-entry-ux-reset-r1.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: node tools/fp86-voice-v1-domain-smoke.cjs
      - run: node tools/fp86-native-stt-contract-smoke.cjs
      - run: node tools/fp86-native-bridge-contract-smoke.cjs
      - run: node tools/fp86-native-app-shell-contract-smoke.cjs
      - run: node tools/fp86-physical-input-ux-smoke.cjs
      - run: xcodebuild -version
      - run: >-
          xcodebuild
          -project mobile/ios-app/FamilyPilotApp.xcodeproj
          -scheme FamilyPilotApp
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          FAMILY_PILOT_VOICE_LOCALE=ru-RU
          build
