name: PF-08A M4-03 Savings Accounts Forecast Gate

on:
  pull_request:
    paths:
      - 'familypilot-m4-03-savings-accounts.js'
      - 'familypilot-m4-03-savings-accounts-ui.js'
      - 'familypilot-scope.js'
      - 'src/familypilot-scope.js'
      - 'tools/pf08a-m4-03-savings-accounts-forecast-browser-smoke.mjs'
      - '.github/workflows/pf08a-m4-03-savings-accounts-forecast.yml'

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: ubuntu-24.04
    steps:
      - name: Quiet exact-head checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Verify exact checked-out head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Verify loader mirrors and syntax
        run: |
          cmp -s familypilot-scope.js src/familypilot-scope.js
          node --check familypilot-m4-03-savings-accounts.js
          node --check familypilot-m4-03-savings-accounts-ui.js
          node --check familypilot-scope.js
          node --check tools/pf08a-m4-03-savings-accounts-forecast-browser-smoke.mjs
      - name: Verify M4-03 savings accounts and forecast
        run: node tools/pf08a-m4-03-savings-accounts-forecast-browser-smoke.mjs
