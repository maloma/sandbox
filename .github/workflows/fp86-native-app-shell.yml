name: FP86 Native App Shell

on:
  push:
    branches: [fp86-native-app-shell-v1]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: node tools/fp86-voice-v1-domain-smoke.cjs
      - run: node tools/fp86-native-stt-contract-smoke.cjs
      - run: node tools/fp86-native-bridge-contract-smoke.cjs
      - run: node tools/fp86-native-app-shell-contract-smoke.cjs
      - run: gradle -p mobile/android-app :app:assembleDebug -PvoiceLocaleTag=en-US
      - run: test -f mobile/android-app/app/build/outputs/apk/debug/app-debug.apk

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: node tools/fp86-voice-v1-domain-smoke.cjs
      - run: node tools/fp86-native-stt-contract-smoke.cjs
      - run: node tools/fp86-native-bridge-contract-smoke.cjs
      - run: node tools/fp86-native-app-shell-contract-smoke.cjs
      - run: xcodebuild -version
      - run: >-
          xcodebuild
          -project mobile/ios-app/FamilyPilotApp.xcodeproj
          -scheme FamilyPilotApp
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          FAMILY_PILOT_VOICE_LOCALE=en-US
          build
