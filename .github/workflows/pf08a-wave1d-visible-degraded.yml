name: PF-08A Wave 1D Visible Degraded Mode

on:
  pull_request:
    paths:
      - 'index.html'
      - 'familypilot-module-registry.js'
      - 'familypilot-module-registry-retry-correction.js'
      - 'familypilot-module-registry-ui.js'
      - 'familypilot-module-entry-bridge.js'
      - 'src/familypilot-module-registry.js'
      - 'src/familypilot-module-registry-retry-correction.js'
      - 'src/familypilot-module-registry-ui.js'
      - 'src/familypilot-module-entry-bridge.js'
      - 'tools/pf08a-wave1d-module-registry-domain-smoke.mjs'
      - 'tools/pf08a-wave1d-visible-degraded-browser-smoke.mjs'
      - 'tools/pf08a-wave1d-integrated-browser-smoke.mjs'
      - '.github/workflows/pf08a-wave1d-visible-degraded.yml'

permissions:
  contents: read

jobs:
  verify-wave1d:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Quiet exact-head checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Check syntax and mirrors
        run: |
          set -euxo pipefail
          node --check familypilot-module-registry.js
          node --check familypilot-module-registry-retry-correction.js
          node --check familypilot-module-registry-ui.js
          node --check familypilot-module-entry-bridge.js
          node --check tools/pf08a-wave1d-module-registry-domain-smoke.mjs
          node --check tools/pf08a-wave1d-visible-degraded-browser-smoke.mjs
          node --check tools/pf08a-wave1d-integrated-browser-smoke.mjs
          cmp familypilot-module-registry.js src/familypilot-module-registry.js
          cmp familypilot-module-registry-retry-correction.js src/familypilot-module-registry-retry-correction.js
          cmp familypilot-module-registry-ui.js src/familypilot-module-registry-ui.js
          cmp familypilot-module-entry-bridge.js src/familypilot-module-entry-bridge.js
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          names=[
            'familypilot-module-registry.js',
            'familypilot-module-registry-retry-correction.js',
            'familypilot-module-registry-ui.js',
            'familypilot-module-entry-bridge.js',
            'familypilot-scope.js',
          ]
          counts={name:text.count(f'src="./{name}"') for name in names[:-1]}
          positions={name:text.index(name) for name in names}
          fallback=text.index('fpStaticFallback')
          print({'counts':counts,'positions':positions,'fallback':fallback})
          assert all(value==1 for value in counts.values()), counts
          assert fallback < positions['familypilot-module-registry.js'] < positions['familypilot-module-registry-retry-correction.js'] < positions['familypilot-module-registry-ui.js'] < positions['familypilot-module-entry-bridge.js'] < positions['familypilot-scope.js'], positions
          PY
      - name: Verify registry domain
        run: node tools/pf08a-wave1d-module-registry-domain-smoke.mjs
      - name: Verify normal integrated load
        run: node tools/pf08a-wave1d-integrated-browser-smoke.mjs
      - name: Verify visible degraded and recovery behavior
        run: node tools/pf08a-wave1d-visible-degraded-browser-smoke.mjs
      - name: Run Wave 1C persistence regressions
        run: |
          node tools/pf08a-wave1c-persistence-browser-smoke.mjs
          node tools/pf08a-wave1c-compatibility-migration-smoke.mjs
          node tools/pf08a-wave1c-integrated-browser-smoke.mjs
