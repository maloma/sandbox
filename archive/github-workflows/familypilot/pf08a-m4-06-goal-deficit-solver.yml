name: PF-08A M4-06 Goal and Deficit Solver Gate

on:
  pull_request:
    paths:
      - 'familypilot-m4-06-goal-deficit-solver.js'
      - 'familypilot-m4-06-goal-deficit-solver-ui.js'
      - 'familypilot-viewport-anchor.js'
      - 'tools/pf08a-m4-06-goal-deficit-solver-browser-smoke.mjs'
      - '.github/workflows/pf08a-m4-06-goal-deficit-solver.yml'

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: ubuntu-24.04
    steps:
      - name: Quiet exact-head checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Verify exact checked-out head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Verify syntax
        run: |
          node --check familypilot-m4-06-goal-deficit-solver.js
          node --check familypilot-m4-06-goal-deficit-solver-ui.js
          node --check familypilot-viewport-anchor.js
          node --check tools/pf08a-m4-06-goal-deficit-solver-browser-smoke.mjs
      - name: Verify goal and deficit solver
        run: node tools/pf08a-m4-06-goal-deficit-solver-browser-smoke.mjs
