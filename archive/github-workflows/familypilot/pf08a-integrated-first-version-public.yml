name: PF-08A Integrated First-Version Public Verification

on:
  pull_request:
    paths:
      - 'tools/pf08a-integrated-first-version-public-smoke.mjs'
      - '.github/workflows/pf08a-integrated-first-version-public.yml'

permissions:
  contents: read

jobs:
  verify-public-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Quiet exact-head checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Verify exact checked-out head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Verify public integrated diagnostic
        env:
          PUBLIC_URL: https://maloma.github.io/sandbox/
          EXPECTED_MAIN_PF08A_INTEGRATED: 860c16ae197aacb80c74fcb671c5745fefd809bb
        run: |
          node --check tools/pf08a-integrated-first-version-public-smoke.mjs
          node tools/pf08a-integrated-first-version-public-smoke.mjs
