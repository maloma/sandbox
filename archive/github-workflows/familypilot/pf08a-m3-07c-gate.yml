name: PF-08A M3-07C Wallet and Partial State Gate

on:
  pull_request:
    branches: [main]
    paths:
      - familypilot-obligation-wallet-isolation.js
      - familypilot-partial-state-visuals.js
      - familypilot-partial-payment-entry-ui.js
      - familypilot-scope.js
      - src/familypilot-scope.js
      - tools/pf08a-m3-07c-browser-smoke.mjs
      - .github/workflows/pf08a-m3-07c-gate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-exact-head:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quiet exact-head checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "${HEAD_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check syntax, mirror and decision contract
        run: |
          node --check familypilot-obligation-wallet-isolation.js
          node --check familypilot-partial-state-visuals.js
          node --check familypilot-partial-payment-entry-ui.js
          node --check familypilot-scope.js
          node --check tools/pf08a-m3-07c-browser-smoke.mjs
          cmp familypilot-scope.js src/familypilot-scope.js
          grep -qF "op.walletId===item.walletId" familypilot-partial-payment-entry-ui.js
          grep -qF "Операция находится в другом кошельке" familypilot-obligation-wallet-isolation.js
          grep -qF "partial-time--today" familypilot-partial-state-visuals.js
          grep -qF "partial-time--overdue" familypilot-partial-state-visuals.js

      - name: Browser verification — wallet isolation and combined state
        run: node tools/pf08a-m3-07c-browser-smoke.mjs

      - name: Browser regression — overpayment resolution
        run: node tools/pf08a-m3-07b-r05-browser-smoke.mjs

      - name: Browser regression — exact reconciliation
        run: node tools/pf08a-m3-07b-r01-browser-smoke.mjs

      - name: Browser regression — partial payments
        run: node tools/pf08a-m3-07-partial-payments-browser-smoke.mjs

      - name: Browser regression — linked operation lifecycle
        run: node tools/pf08a-m3-07b-r04-browser-smoke.mjs

      - name: Browser regression — mobile operations
        run: node tools/pf08a-m3-06-mobile-ux-browser-smoke.mjs
